<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Against the Swarm Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
:root {
  --bg: #d9cdb6; --surface: #f8f2e6; --raised: #fffaf0; --fg: #2a211b; --muted: #75665a;
  --line: #bfae92; --accent: #b3401f; --accent-fg: #fff7ee; --swarm: #5b6b2c; --asset: #2f5f7a;
  --shade: rgba(42, 33, 27, .5); --mat: #e9dfcb; --mat-alt: #e1d5bd; --mat-ace: #f1e9d8; --die: #fffdf7;
  --card: 110px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14110f; --surface: #25201b; --raised: #302a24; --fg: #efe4d2; --muted: #a8998a;
  --line: #4a4037; --accent: #e0683f; --accent-fg: #1b1410; --swarm: #a3b860; --asset: #7fb4d1;
  --shade: rgba(0, 0, 0, .65); --mat: #221d19; --mat-alt: #1d1915; --mat-ace: #2a241f; --die: #efe4d2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14110f; --surface: #25201b; --raised: #302a24; --fg: #efe4d2; --muted: #a8998a;
  --line: #4a4037; --accent: #e0683f; --accent-fg: #1b1410; --swarm: #a3b860; --asset: #7fb4d1;
  --shade: rgba(0, 0, 0, .65); --mat: #221d19; --mat-alt: #1d1915; --mat-ace: #2a241f; --die: #efe4d2; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.display { font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight: 400; letter-spacing: .04em; }
button { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  min-height: 34px; padding: 4px 10px; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .4; }
button.tiny { min-width: 30px; padding: 0; }
input, select { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; min-height: 34px; padding: 4px 10px; width: 100%; }

.unused-toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; }
.toolbar .group { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); flex: 0 0 auto; }
.toolbar .group:last-child { border-right: 0; }
.toolbar .value { font-size: 20px; padding: 0 6px; white-space: nowrap; }
.toolbar select { width: auto; }

#table { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.mat { flex: 1; min-height: 0; display: flex; padding: 8px 16px; position: relative; }
.area { position: relative; overflow: hidden; isolation: isolate; border: 2px solid var(--line); border-radius: 8px; }
.area .strip .label, .area > .label { position: absolute; left: 8px; top: 3px; font-size: 16px; color: var(--muted); opacity: .85; pointer-events: none; z-index: 0; }
#field { flex: 1; min-width: 0; background: var(--mat); border-left: 6px solid var(--swarm); }
#field .strip { position: absolute; left: 0; top: 0; bottom: 0; width: 14%; border-right: 2px dashed var(--line); background: var(--mat-alt); pointer-events: none; }
#field .band { position: absolute; left: 14%; right: 0; height: 33.334%; border-bottom: 2px solid var(--line); pointer-events: none; }
#field .band.last { border-bottom: 0; }
#field .band .label { position: absolute; left: 8px; top: 3px; font-size: 16px; color: var(--muted); opacity: .85; }
.side { position: absolute; right: 24px; top: 16px; z-index: 100000; width: 200px; display: flex; flex-direction: column; gap: 6px; opacity: .92; }
.side button { border-radius: 17px; box-shadow: 0 1px 4px var(--shade); }
.banner { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 100000; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 470px); background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 6px 12px; box-shadow: 0 3px 12px var(--shade); }
.banner .display { font-size: 22px; white-space: nowrap; }
.draft { display: flex; gap: 12px; justify-content: center; }
.draft button { flex: 1 1 0; max-width: 240px; padding: 0; border: 0; background: none; }
.draft img { width: 100%; display: block; border-radius: 10px; box-shadow: 0 2px 8px var(--shade); }
.side .split { display: flex; gap: 4px; }
.side .bubble { align-items: center; background: var(--raised); border: 1px solid var(--line); border-radius: 17px; box-shadow: 0 1px 4px var(--shade); }
.side .bubble span { flex: 1; text-align: center; }
.side .bubble button { flex: 0 0 40px; border: 0; background: transparent; box-shadow: none; font-size: 1.1em; } .side .split button { flex: 1; padding: 4px; font-size: .85em; }

.dock { flex: 0 0 auto; display: flex; gap: 12px; align-items: stretch; padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 2px solid var(--accent); overflow-x: auto; }
.dock .slot { display: flex; flex-direction: column; gap: 3px; flex: 0 0 auto; color: var(--muted); font-size: 12px; }
.dock .stats { justify-content: flex-start; gap: 4px; width: 210px; }
.dock .tabs { justify-content: center; gap: 6px; }
.dock .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.dock .info { justify-content: flex-start; gap: 6px; color: var(--fg); min-width: 200px; padding-top: 6px; }
.dock .info .row { display: flex; align-items: center; gap: 4px; }
.dock .info .value { font-size: 22px; flex: 1; white-space: nowrap; }
.dock { min-height: calc(var(--card) * 1.397 + 46px); }
.counter { display: flex; align-items: center; gap: 2px; color: var(--fg); font-size: 14px; }
.counter span { flex: 1; } .counter b { font-size: 18px; font-variant-numeric: tabular-nums; }
#tray { display: flex; flex-wrap: wrap; gap: 4px; min-height: calc(var(--card) * .36 + 8px); padding: 3px; border: 2px dashed var(--line); border-radius: 8px; align-content: flex-start; }
#panoply { display: flex; gap: 8px; flex: 1 1 auto; min-width: calc(var(--card) * 2); overflow-x: auto; padding: 6px 8px 6px 6px; border: 2px dashed var(--line); border-radius: 8px; align-items: flex-start; min-height: calc(var(--card) * 1.397 + 16px); }
.dock .wide { flex: 1 1 auto; min-width: 0; }
.piles { display: flex; gap: 8px; }

.obj { touch-action: none; cursor: pointer; flex: 0 0 auto; }
.area .obj { position: absolute; }
.card { position: relative; width: var(--card); height: calc(var(--card) * 1.397); border-radius: calc(var(--card) * .06); box-shadow: 0 2px 5px var(--shade); transition: transform .12s; font-size: calc(var(--card) * .16); }
.card img { width: 100%; height: 100%; border-radius: inherit; display: block; pointer-events: none; -webkit-user-drag: none; }
.card.exhausted { transform: rotate(90deg); }
#panoply .card.exhausted { transform: rotate(12deg); filter: grayscale(.6) brightness(.75); }
.card .count { position: absolute; right: -.4em; top: -.4em; min-width: 1.7em; height: 1.7em; border-radius: 1em; background: var(--accent); color: var(--accent-fg);
  font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); }
.card.exhausted .count { transform: rotate(-90deg); }
.die { width: calc(var(--card) * .36); height: calc(var(--card) * .36); border-radius: 18%; background: var(--die); color: #2a211b; border: 2px solid #2a211b; font-size: calc(var(--card) * .22); font-weight: 800;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px var(--shade); font-variant-numeric: tabular-nums; }
.die.spent { opacity: .3; border-style: dashed; }
.lifted { opacity: .25; }
#ghost { position: fixed; z-index: 2000000; pointer-events: none; margin: 0; transition: none; box-shadow: 0 10px 22px var(--shade); }
.pile { width: var(--card); height: calc(var(--card) * 1.397); border-radius: calc(var(--card) * .06); border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--fg); overflow: hidden; }
.pile.full { border: 2px solid var(--fg); color: var(--accent-fg); box-shadow: 3px 3px 0 var(--line); }
.pile.full.swarm { background: var(--swarm); } .pile.full.asset { background: var(--asset); } .pile.full.token { background: var(--muted); }
.pile.discard.has { border-style: solid; }
.over { outline: 3px solid var(--accent); outline-offset: -3px; }
.pile b { font-size: calc(var(--card) * .28); line-height: 1; font-variant-numeric: tabular-nums; pointer-events: none; }
.pile img { width: 100%; height: 100%; display: block; pointer-events: none; }

@media (max-width: 700px) {
  :root { --card: 62px; }
  .banner { max-width: calc(100% - 24px); top: 8px; }
  .side { left: 20px; right: 20px; top: auto; bottom: 12px; width: auto; flex-direction: row; overflow-x: auto; gap: 4px; font-size: 13px; }
  .side button, .side .split { flex: 0 0 auto; min-height: 32px; }
  .dock { flex-wrap: wrap; gap: 6px; max-height: 46%; overflow-y: auto; }
  .dock .stats { width: 150px; }
}

#preview { position: fixed; top: 56px; width: min(300px, 62vw); border-radius: 12px; box-shadow: 0 6px 24px var(--shade); pointer-events: none; z-index: 30; }
#menu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px var(--shade); padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 190px; }
#menu button { text-align: left; border-color: transparent; background: transparent; display: flex; justify-content: space-between; gap: 16px; }
#menu button:hover { background: var(--raised); border-color: var(--line); }
#menu kbd { color: var(--muted); font: inherit; }
#menu .line { display: flex; gap: 4px; align-items: center; padding: 0 6px; }
#menu .line span { flex: 1; }
#menu .line button { justify-content: center; min-width: 34px; border-color: var(--line); background: var(--raised); }
#toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 20px;
  z-index: 50; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.backdrop { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.sheet { background: var(--surface); width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; user-select: text; }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-head .display { flex: 1; font-size: 26px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.grid button { padding: 0; border: 0; background: none; border-radius: 6px; min-height: 0; }
.grid img { width: 100%; display: block; border-radius: 6px; box-shadow: 0 1px 4px var(--shade); }
.hint { color: var(--muted); margin: 0; }
.setup { max-width: 640px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; user-select: text; }
.setup h1 { font-size: 48px; line-height: .95; color: var(--accent); margin: 0; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.keys dt { font-weight: 700; } .keys dd { margin: 0; color: var(--muted); }
</style>

<div id="app" style="display:contents"></div>
<img id="preview" alt="" hidden>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<div id="overlay"></div>

<script>
"use strict";
/* The table knows no rules. It moves cards, shuffles piles, rolls dice and draws invasions.
   Everything fits one fixed screen: no camera. Positions on the mat are fractions of their area.
   One browser tab shows one player's sector. Tabs of the same browser share the game through localStorage. */
const SAVE_KEY = "against-the-swarm-table-6", SEAT_KEY = "against-the-swarm-seat", SIZE_KEY = "against-the-swarm-card-size";
const FREE_AREAS = ["field"];
const STRIP = 0.14; /* width of the Emprise strip, a purely graphic mark on the single play area */
const ZONE_NAMES = ["Zone 3 · Éloignée", "Zone 2 · Proche", "Zone 1 · Contact"];
const RANK_ADDED_AT_WAVE = { 3: 2, 5: 3, 7: 4 };
const ROMAN = ["", "I", "II", "III", "IV"];
const PILES = [
  { name: "swarmPile", label: "Pile Essaim", kind: "swarm" },
  { name: "swarmDiscard", label: "Défausse", kind: "swarm", discard: true },
  { name: "tokens", label: "Jetons", kind: "token" },
  { name: "assetPile", label: "Pile d'atouts", kind: "asset" },
  { name: "assetDiscard", label: "Défausse", kind: "asset", discard: true },
];
const roundsToHold = wave => 5 + Math.floor((wave - 1) / 2);
const threatLevel = wave => 6 + Math.floor(wave / 2);

let CARDS = {};
let state = null;
let seat = 0;
let cardSize = null;
let undoStack = [], redoStack = [];
let sheet = null;
let panel = "ace";
let gesture = null, hovered = null, toastTimer = null;

const app = document.getElementById("app"), overlay = document.getElementById("overlay");
const preview = document.getElementById("preview"), menu = document.getElementById("menu"), toastBox = document.getElementById("toast");
const escapeHtml = text => String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const card = id => CARDS[id];
const idsOf = set => Object.keys(CARDS).filter(id => CARDS[id].set === set);
const rollDie = () => 1 + Math.floor(Math.random() * 6);
const aceName = index => card(state.sectors[index].ace).name;
const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}

/* ---------- persistence, tab sharing, undo, redo ---------- */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (error) { /* storage unavailable */ } }
function load() { try { const raw = localStorage.getItem(SAVE_KEY); state = raw ? JSON.parse(raw) : null; } catch (error) { state = null; } }
function loadSeat() { try { seat = Number(sessionStorage.getItem(SEAT_KEY)) || 0; cardSize = Number(localStorage.getItem(SIZE_KEY)) || null; } catch (error) { seat = 0; } clampSeat(); applyCardSize(); }
function setSeat(index) { seat = index; clampSeat(); try { sessionStorage.setItem(SEAT_KEY, String(seat)); } catch (error) { /* ignore */ } }
function clampSeat() { if (!state || seat >= state.sectors.length || seat < 0) seat = 0; }
function applyCardSize() { if (cardSize) document.documentElement.style.setProperty("--card", cardSize + "px"); else document.documentElement.style.removeProperty("--card"); }
function resizeCards(step) {
  const current = cardSize || parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--card"));
  cardSize = clamp(Math.round(current + step), 40, 220); applyCardSize();
  try { localStorage.setItem(SIZE_KEY, String(cardSize)); } catch (error) { /* ignore */ }
}
window.addEventListener("storage", event => {
  if (event.key !== SAVE_KEY || gesture) return;
  load(); clampSeat(); undoStack = []; redoStack = [];
  if (!state) { app.innerHTML = ""; sheet = null; }
  render();
});
function commit(before) {
  undoStack.push(before); if (undoStack.length > 80) undoStack.shift();
  redoStack = []; save(); render();
}
function act(change) { const before = JSON.stringify(state); change(); commit(before); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(state)); state = JSON.parse(undoStack.pop()); clampSeat(); save(); render(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(state)); state = JSON.parse(redoStack.pop()); clampSeat(); save(); render(); }
function toast(text) {
  toastBox.textContent = text; toastBox.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastBox.hidden = true; }, 3200);
}

/* ---------- table actions ---------- */
const mine = () => state.items.filter(item => item.sector === seat);
const inArea = area => mine().filter(item => item.area === area).sort((a, b) => a.z - b.z);
function place(id, area, x, y, extra = {}) {
  const item = Object.assign({ key: state.next++, kind: "card", id, sector: seat, area, x, y, z: state.top++, exhausted: false, counter: 0, parent: null }, extra);
  state.items.push(item); return item;
}
function placeDie(area, x, y, extra = {}) {
  const item = Object.assign({ key: state.next++, kind: "die", value: rollDie(), sector: seat, area, x, y, z: state.top++, parent: null, spent: false }, extra);
  state.items.push(item); return item;
}
function seatPlayer(ace) {
  const sector = state.sectors.length;
  state.sectors.push({ ace, actionModifier: 0, pending: null, wounds: 0, guard: 0, invasion: null, draft: null });
  idsOf("asset").filter(id => card(id).starting).forEach(id => place(id, "panoply", 0, 0, { sector }));
  place("swarm/infestation", "field", 0.012, 0.05, { sector });
  return sector;
}
function newGame(ace) {
  undoStack = []; redoStack = [];
  state = {
    wave: 1, round: 1, phase: "swarm", held: false, ranks: [1], next: 1, top: 1, items: [], sectors: [],
    swarmPile: shuffle(idsOf("swarm").filter(id => card(id).rank === 1)), swarmDiscard: [],
    assetPile: shuffle(idsOf("asset").filter(id => !card(id).starting)), assetDiscard: [],
  };
  setSeat(seatPlayer(ace));
  save(); render();
}
function drawFrom(name) {
  const discardName = name === "swarmPile" ? "swarmDiscard" : "assetDiscard";
  if (!state[name].length) {
    if (!state[discardName].length) return null;
    state[name] = shuffle(state[discardName]); state[discardName] = [];
    toast("La défausse est remélangée pour former une nouvelle pile.");
  }
  return state[name].pop();
}
function removeItem(item) {
  state.items.forEach(other => { if (other.parent === item.key) other.parent = null; });
  state.items = state.items.filter(other => other !== item);
}
function discardItem(item) {
  removeItem(item);
  if (item.kind !== "card") return;
  const data = card(item.id);
  if (data.set === "asset") state.assetDiscard.push(item.id);
  else if (data.set === "swarm" && data.kind !== "token" && data.kind !== "infestation") state.swarmDiscard.push(item.id);
}
const belongsToNoPile = data => data.set === "ace" || data.kind === "token" || data.kind === "infestation";
function returnToPile(item, bottom) {
  const data = card(item.id);
  if (belongsToNoPile(data)) return toast("Cette carte n'appartient à aucune pile.");
  removeItem(item);
  const pile = state[data.set === "asset" ? "assetPile" : "swarmPile"];
  if (bottom) pile.unshift(item.id); else pile.push(item.id);
}
/* Puts a card where a fresh arrival is easy to see: Emprises in the left strip, the rest spread along a band. */
function arrive(id, band = 0, extra = {}) {
  const strip = card(id).kind === "emprise" || card(id).kind === "infestation";
  const cards = inArea("field").filter(item => item.kind === "card");
  if (strip) {
    const count = cards.filter(item => item.x < STRIP - 0.03).length;
    return place(id, "field", 0.012 + (count % 2) * 0.015, clamp(0.05 + count * 0.15, 0, 0.8), extra);
  }
  const count = cards.filter(item => item.x >= STRIP - 0.03 && Math.floor(item.y * 3 + 0.2) === band).length;
  return place(id, "field", STRIP + 0.015 + (count % 11) * 0.065, band / 3 + 0.045 + (count % 3) * 0.012, extra);
}
/* The invasion draw is played by hand: each click on the swarm pile reveals one card and the table only keeps count. */
function startInvasion() {
  const sector = state.sectors[seat];
  const draws = mine().filter(item => item.kind === "card" && card(item.id).kind === "infestation").length;
  if (!draws) return toast("Aucune carte Infestation dans ce secteur.");
  sector.invasion = { total: 0, draw: 1, draws, done: false };
  panel = "piles";
}
function closeDraw(invasion) {
  if (invasion.draw < invasion.draws) { invasion.draw++; invasion.total = 0; toast(`Tirage ${invasion.draw} sur ${invasion.draws}.`); }
  else invasion.done = true;
}
function invasionStep() {
  const sector = state.sectors[seat], invasion = sector.invasion, level = threatLevel(state.wave);
  if (invasion.done) return;
  if (invasion.total >= level) return closeDraw(invasion);
  if (sector.pending) {
    invasion.total += Math.max(0, (card(sector.pending.id).threat || 0) - sector.pending.consumed);
    arrive(sector.pending.id); sector.pending = null;
  } else {
    const id = drawFrom("swarmPile");
    if (!id) { toast("La pile Essaim et sa défausse sont vides."); invasion.done = true; return; }
    const threat = card(id).threat || 0;
    if (invasion.total + threat > level) {
      sector.pending = { id, consumed: level - invasion.total }; invasion.total = level;
      toast(`${card(id).name} dépasse le seuil et reste en attente.`);
    } else { arrive(id); invasion.total += threat; }
  }
  if (invasion.total >= level) closeDraw(invasion);
}
function endTurn() {
  if (state.phase === "swarm") {
    readyAll("swarm"); state.phase = "players";
    state.sectors.forEach(sector => { sector.guard = 0; });
    return;
  }
  readyAll("asset");
  if (state.round >= roundsToHold(state.wave)) { state.held = true; sheet = { type: "held" }; return; }
  state.round++; state.phase = "swarm";
}
function startDraft() {
  const options = [];
  for (let n = 0; n < 3; n++) { const id = drawFrom("assetPile"); if (id) options.push(id); }
  if (!options.length) return toast("La pile d'atouts et sa défausse sont vides.");
  state.sectors[seat].draft = options;
}
function resolveDraft(choice) {
  const sector = state.sectors[seat];
  sector.draft.forEach((id, index) => { if (index === choice) place(id, "panoply", 0, 0); else state.assetDiscard.push(id); });
  sector.draft = null;
}
const diceCount = () => Math.max(1, card(state.sectors[seat].ace).ap + state.sectors[seat].actionModifier);
function rollSector() {
  inArea("tray").forEach(removeItem);
  for (let n = 0, count = diceCount(); n < count; n++) placeDie("tray", 0, 0);
}

    if (item) openItemMenu(item, event.clientX, event.clientY);
  });
  table.addEventListener("pointerdown", event => {
    if (event.button === 2 || event.target.closest("button")) return;
    closeMenu(); hidePreview();
    const node = event.target.closest(".obj");
    if (!node || gesture || (!node.dataset.key && !node.dataset.pile)) return;
    table.setPointerCapture(event.pointerId);
    gesture = { type: "press", node, sx: event.clientX, sy: event.clientY };
    if (event.pointerType !== "mouse") {
      gesture.timer = setTimeout(() => {
        const pressed = gesture; gesture = null;
        if (pressed.node.dataset.pile) return openPileMenu(pressed.node.dataset.pile, pressed.sx, pressed.sy);
        const item = state.items.find(other => other.key === Number(pressed.node.dataset.key));
        if (item) openItemMenu(item, pressed.sx, pressed.sy);
      }, 480);
    }
  });
  table.addEventListener("pointermove", event => {
    if (!gesture) { if (event.pointerType === "mouse") { const node = event.target.closest("[data-key]"); hovered = node ? Number(node.dataset.key) : null; } return; }
    if (gesture.type === "press") {
      if (Math.hypot(event.clientX - gesture.sx, event.clientY - gesture.sy) < 6) return;
      clearTimeout(gesture.timer);
      if (gesture.node.dataset.pile && !gesture.node.dataset.pile.endsWith("Pile")) { gesture = null; return; }
      startDrag(event);
    }
    if (!gesture || gesture.type !== "drag") return;
    gesture.ghost.style.left = event.clientX - gesture.dx + "px"; gesture.ghost.style.top = event.clientY - gesture.dy + "px";
    const tab = document.elementsFromPoint(event.clientX, event.clientY).find(node => node.dataset && node.dataset.panel);
    if (tab && tab.dataset.panel !== panel) { panel = tab.dataset.panel; render(); }
    const target = targetAt(event.clientX, event.clientY);
    document.querySelectorAll(".over").forEach(node => { if (!target || node !== target.node) node.classList.remove("over"); });
    if (target) target.node.classList.add("over");
  });
  const finish = event => {
    if (!gesture) return;
    clearTimeout(gesture.timer);
    const done = gesture;
    if (done.type === "drag") {
      if (event.type === "pointercancel") { done.ghost.remove(); state = JSON.parse(done.before); gesture = null; return render(); }
      endDrag(event); gesture = null; return;
    }
    gesture = null;
    if (event.type === "pointercancel") return;
    if (done.node.dataset.pile) {
      const name = done.node.dataset.pile;
      if (name === "tokens") return openSheet({ type: "picker", tokens: true });
      if (name.endsWith("Discard")) return openSheet({ type: "pile", name });
      const invasion = state.sectors[seat].invasion;
      return name === "swarmPile" && invasion && !invasion.done ? act(invasionStep) : drawToTable(name);
    }
    const item = state.items.find(other => other.key === Number(done.node.dataset.key));
    if (!item) return;
    if (item.kind === "die") return act(() => { if (item.area === "tray") item.spent = !item.spent; else item.value = item.value % 6 + 1; });
    act(() => { item.exhausted = !item.exhausted; });
  };
  table.addEventListener("pointerup", finish);
  table.addEventListener("pointercancel", finish);
  table.addEventListener("pointerleave", () => { hovered = null; });
}
/* ---------- buttons, sheets, keyboard ---------- */
document.addEventListener("pointerdown", event => { if (!menu.hidden && !event.target.closest("#menu, #table")) { closeMenu(); hidePreview(); } });
document.addEventListener("change", event => {
  if (!event.target.matches("[data-seat]")) return;
  if (event.target.value === "add") return openSheet({ type: "ace" });
  setSeat(Number(event.target.value)); render();
});
document.addEventListener("input", event => {
  if (!event.target.matches("[data-search]")) return;
  sheet.query = event.target.value; overlay.innerHTML = sheetHtml();
  const input = overlay.querySelector("[data-search]"); input.focus(); input.setSelectionRange(input.value.length, input.value.length);
});
document.addEventListener("click", event => {
  const target = event.target.closest("button, [data-close]");
  if (!target || target.closest("#menu")) return;
  const data = target.dataset;
  if ("close" in data) { if (target === event.target || target.tagName === "BUTTON") { sheet = null; hidePreview(); render(); } return; }
  if (data.ace) { hidePreview(); return state ? act(() => { setSeat(seatPlayer(data.ace)); sheet = null; }) : newGame(data.ace); }
  if (data.panel) { panel = data.panel; return render(); }
  if (data.do) return command(data.do);
  if (data.draft) return act(() => resolveDraft(Number(data.draft)));
  if (data.threat) return act(() => { const invasion = state.sectors[seat].invasion; invasion.total = Math.max(0, invasion.total + Number(data.threat)); });
  if (data.size) return resizeCards(Number(data.size));
  if (data.wave) return act(() => setWave(state.wave + Number(data.wave)));
  if (data.round) return act(() => { state.round = Math.max(1, state.round + Number(data.round)); });
  if (data.points) return act(() => { state.sectors[seat].actionModifier += Number(data.points); });
  if (data.stat) return act(() => { const sector = state.sectors[seat]; sector[data.stat] = Math.max(0, (sector[data.stat] || 0) + Number(data.by)); });
  if (data.take) return act(() => { const [id] = state[sheet.name].splice(Number(data.take), 1); arrive(id, 1); sheet = null; hidePreview(); });
  if (data.pick) return act(() => { arrive(data.pick, 1, { exhausted: !!sheet.tokens }); sheet = null; hidePreview(); });
});
function command(name) {
  switch (name) {
    case "undo": return undo();
    case "redo": return redo();
    case "invade": return act(startInvasion);
    case "close-invasion": return act(() => { state.sectors[seat].invasion = null; });
    case "end-turn": return act(endTurn);
    case "held": return openSheet({ type: "held" });
    case "draft": return act(startDraft);
    case "roll": return act(rollSector);
    case "add-die": return act(() => { const count = inArea("field").filter(item => item.kind === "die").length; placeDie("field", 0.45 + (count % 6) * 0.03, 0.45 + (count % 6) * 0.02); });
    case "add-token": return openSheet({ type: "picker", tokens: true });
    case "add-card": return openSheet({ type: "picker" });
    case "menu": return openSheet({ type: "menu" });
    case "next-wave": return act(() => { sheet = null; nextWave(); });
    case "ask-reset": sheet.confirm = true; return render();
    case "reset": state = null; sheet = null; undoStack = []; redoStack = []; try { localStorage.removeItem(SAVE_KEY); } catch (error) { /* ignore */ } app.innerHTML = ""; return render();
  }
}
document.addEventListener("keydown", event => {
  if (!state || event.target.matches("input, select")) return;
  const key = event.key.toLowerCase();
  if ((event.ctrlKey || event.metaKey) && key === "z") { event.preventDefault(); return event.shiftKey ? redo() : undo(); }
  if (key === "escape") { closeMenu(); hidePreview(); if (sheet) { sheet = null; render(); } return; }
  if (sheet || hovered === null || event.ctrlKey || event.metaKey) return;
  const item = state.items.find(other => other.key === hovered);
  if (!item) return;
  if (item.kind === "die" && /^[1-6]$/.test(key)) return itemAction(item.key, "value", key);
  const action = { t: "exhaust", d: "discard", c: "copy", "+": "plus", "=": "plus", "-": "minus", delete: "remove", backspace: "remove", r: item.kind === "die" ? "reroll" : null }[key];
  if (action) { event.preventDefault(); itemAction(item.key, action); }
});

fetch("cards.json").then(response => response.json()).then(cards => { CARDS = cards; load(); loadSeat(); render(); })
  .catch(() => { app.innerHTML = '<p class="hint" style="padding:16px">Impossible de charger les cartes.</p>'; });
</script>
