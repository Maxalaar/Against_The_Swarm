<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Against the Swarm Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
:root {
  --bg: #d9cdb6; --surface: #f8f2e6; --raised: #fffaf0; --fg: #2a211b; --muted: #75665a;
  --line: #bfae92; --accent: #b3401f; --accent-fg: #fff7ee; --swarm: #5b6b2c; --asset: #2f5f7a;
  --shade: rgba(42, 33, 27, .5); --mat: #e9dfcb; --mat-alt: #e1d5bd; --mat-ace: #f1e9d8; --die: #fffdf7;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14110f; --surface: #25201b; --raised: #302a24; --fg: #efe4d2; --muted: #a8998a;
  --line: #4a4037; --accent: #e0683f; --accent-fg: #1b1410; --swarm: #a3b860; --asset: #7fb4d1;
  --shade: rgba(0, 0, 0, .65); --mat: #221d19; --mat-alt: #1d1915; --mat-ace: #2a241f; --die: #efe4d2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14110f; --surface: #25201b; --raised: #302a24; --fg: #efe4d2; --muted: #a8998a;
  --line: #4a4037; --accent: #e0683f; --accent-fg: #1b1410; --swarm: #a3b860; --asset: #7fb4d1;
  --shade: rgba(0, 0, 0, .65); --mat: #221d19; --mat-alt: #1d1915; --mat-ace: #2a241f; --die: #efe4d2; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.display { font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif; font-weight: 400; letter-spacing: .04em; }
button { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  min-height: 36px; padding: 4px 10px; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .4; }
input, select { font: inherit; color: inherit; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; padding: 6px 10px; width: 100%; }

.toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; flex: 0 0 auto; }
.toolbar .group { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); flex: 0 0 auto; }
.toolbar .group:last-child { border-right: 0; }
.toolbar .value { font-size: 20px; padding: 0 6px; white-space: nowrap; }
.toolbar .tiny { min-width: 30px; padding: 0; }
#viewport { flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab; }
#viewport.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.region { position: absolute; border: 2px solid var(--line); }
.region .label { position: absolute; left: 12px; top: 6px; font-size: 26px; color: var(--muted); opacity: .8; pointer-events: none; }
.region.zone { background: var(--mat); border-left: 8px solid var(--swarm); }
.region.zone.alt { background: var(--mat-alt); }
.region.ace { background: var(--mat-ace); border-left: 8px solid var(--accent); }
.region.tray { border-style: dashed; border-radius: 12px; }
.region.tray .label { font-size: 18px; top: 2px; }
.head { position: absolute; display: flex; align-items: center; gap: 12px; font-size: 20px; }
.head .display { font-size: 44px; line-height: 1; }
.head button { font-size: 20px; min-height: 48px; padding: 4px 16px; }
.head .pending { color: var(--muted); text-decoration: underline dotted; cursor: help; }
.rollbar { position: absolute; display: flex; align-items: center; gap: 6px; font-size: 20px; }
.rollbar button { font-size: 20px; min-height: 48px; min-width: 48px; }

.obj { position: absolute; touch-action: none; cursor: pointer; }
.card { width: 126px; height: 176px; border-radius: 8px; box-shadow: 0 2px 6px var(--shade); transition: transform .12s; }
.card img { width: 100%; height: 100%; border-radius: 8px; display: block; pointer-events: none; -webkit-user-drag: none; }
.card.exhausted { transform: rotate(90deg); }
.card.selected { outline: 5px solid var(--accent); outline-offset: 2px; }
.card.dragging, .die.dragging { transition: none; box-shadow: 0 10px 22px var(--shade); }
.card .count { position: absolute; right: -10px; top: -10px; min-width: 40px; height: 40px; border-radius: 20px; background: var(--accent); color: var(--accent-fg);
  font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); }
.card.exhausted .count { transform: rotate(-90deg); }
.die { width: 46px; height: 46px; border-radius: 9px; background: var(--die); color: #2a211b; border: 3px solid #2a211b; font-size: 28px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px var(--shade); font-variant-numeric: tabular-nums; }
.pile { width: 126px; height: 176px; border-radius: 8px; border: 3px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 4px; font-size: 18px; padding: 6px; }
.pile.full { border: 3px solid var(--fg); color: var(--accent-fg); box-shadow: 4px 4px 0 var(--line), 8px 8px 0 var(--line); }
.pile.full.swarm { background: var(--swarm); } .pile.full.asset { background: var(--asset); } .pile.full.token { background: var(--muted); }
.pile.discard.has { border-style: solid; background: var(--mat-ace); }
.pile b { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.pile .display { font-size: 22px; line-height: 1; }
#marquee { position: absolute; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; }

#preview { position: fixed; top: 60px; width: min(300px, 62vw); border-radius: 12px; box-shadow: 0 6px 24px var(--shade); pointer-events: none; z-index: 30; }
#menu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px var(--shade); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
#menu button { text-align: left; border-color: transparent; background: transparent; display: flex; justify-content: space-between; gap: 16px; }
#menu button:hover { background: var(--raised); border-color: var(--line); }
#menu kbd { color: var(--muted); font: inherit; }
#menu .line { display: flex; gap: 4px; align-items: center; padding: 0 6px; }
#menu .line span { flex: 1; }
#menu .line button { justify-content: center; min-width: 36px; border-color: var(--line); background: var(--raised); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 20px;
  z-index: 50; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.backdrop { position: fixed; inset: 0; background: var(--shade); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.sheet { background: var(--surface); width: 100%; max-width: 760px; max-height: 100%; overflow-y: auto; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; user-select: text; }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-head .display { flex: 1; font-size: 26px; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.grid button { padding: 0; border: 0; background: none; border-radius: 6px; min-height: 0; }
.grid img { width: 100%; display: block; border-radius: 6px; box-shadow: 0 1px 4px var(--shade); }
.hint { color: var(--muted); margin: 0; }
.setup { max-width: 480px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; user-select: text; }
.setup h1 { font-size: 48px; line-height: .95; color: var(--accent); margin: 0; }
.setup label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
.keys dt { font-weight: 700; } .keys dd { margin: 0; color: var(--muted); }
</style>

<div id="app" style="display:contents"></div>
<img id="preview" alt="" hidden>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<div id="overlay"></div>

<script>
"use strict";
/* The table knows no rules. It moves cards, shuffles piles, rolls dice and draws invasions. */
const SAVE_KEY = "against-the-swarm-table-2";
const CARD_WIDTH = 126, CARD_HEIGHT = 176, DIE_SIZE = 46;
const SECTOR_WIDTH = 860, SECTOR_GAP = 40, SECTORS_LEFT = 220, ZONE_HEIGHT = 230, ACE_HEIGHT = 400, HEAD_HEIGHT = 70;
const ZONE_NAMES = ["Zone 3 · Éloignée", "Zone 2 · Proche", "Zone 1 · Contact"];
const RANK_ADDED_AT_WAVE = { 3: 2, 5: 3, 7: 4 };
const ROMAN = ["", "I", "II", "III", "IV"];
const PILES = [
  { name: "swarmPile", label: "Pile Essaim", kind: "swarm", y: 0 },
  { name: "swarmDiscard", label: "Défausse Essaim", kind: "swarm", discard: true, y: 210 },
  { name: "tokens", label: "Jetons", kind: "token", y: 420 },
  { name: "assetPile", label: "Pile d'atouts", kind: "asset", y: 700 },
  { name: "assetDiscard", label: "Défausse d'atouts", kind: "asset", discard: true, y: 910 },
];
const roundsToHold = wave => 5 + Math.floor((wave - 1) / 2);
const threatLevel = wave => 6 + Math.floor(wave / 2);

let CARDS = {};
let state = null;
let undoStack = [], redoStack = [];
let view = { x: 0, y: 0, k: 1 };
let selection = new Set();
let sheet = null;
let setup = { count: 2, aces: [] };
let gesture = null, hovered = null, previewTimer = null, toastTimer = null;
const pointers = new Map();

const app = document.getElementById("app"), overlay = document.getElementById("overlay");
const preview = document.getElementById("preview"), menu = document.getElementById("menu"), toastBox = document.getElementById("toast");
const escapeHtml = text => String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const card = id => CARDS[id];
const idsOf = set => Object.keys(CARDS).filter(id => CARDS[id].set === set);
const rollDie = () => 1 + Math.floor(Math.random() * 6);
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}

/* ---------- geometry ---------- */
const sectorLeft = index => SECTORS_LEFT + index * (SECTOR_WIDTH + SECTOR_GAP);
const zoneRect = (sector, row) => ({ x: sectorLeft(sector), y: row * ZONE_HEIGHT, w: SECTOR_WIDTH, h: ZONE_HEIGHT });
const aceRect = sector => ({ x: sectorLeft(sector), y: 3 * ZONE_HEIGHT, w: SECTOR_WIDTH, h: ACE_HEIGHT });
const trayRect = sector => ({ x: sectorLeft(sector) + 20, y: 3 * ZONE_HEIGHT + 300, w: 520, h: 80 });
const sectorRect = sector => ({ x: sectorLeft(sector), y: -HEAD_HEIGHT, w: SECTOR_WIDTH, h: HEAD_HEIGHT + 3 * ZONE_HEIGHT + ACE_HEIGHT });
const pileRect = pile => ({ x: 30, y: pile.y, w: CARD_WIDTH, h: CARD_HEIGHT });
const worldRect = () => ({ x: 0, y: -HEAD_HEIGHT, w: sectorLeft(state.sectors.length) - SECTOR_GAP + 20, h: HEAD_HEIGHT + 3 * ZONE_HEIGHT + ACE_HEIGHT + 20 });
const inside = (rect, x, y) => x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
const sizeOf = item => item.kind === "die" ? [DIE_SIZE, DIE_SIZE] : [CARD_WIDTH, CARD_HEIGHT];
const centerOf = item => { const [w, h] = sizeOf(item); return [item.x + w / 2, item.y + h / 2]; };
function toWorld(clientX, clientY) {
  const box = document.getElementById("viewport").getBoundingClientRect();
  return [(clientX - box.left - view.x) / view.k, (clientY - box.top - view.y) / view.k];
}
function viewCenter() {
  const box = document.getElementById("viewport").getBoundingClientRect();
  return toWorld(box.left + box.width / 2, box.top + box.height / 2);
}
function fit(rect) {
  const box = document.getElementById("viewport").getBoundingClientRect();
  const k = Math.min(box.width / (rect.w + 40), box.height / (rect.h + 40), 1.4);
  view = { k, x: (box.width - rect.w * k) / 2 - rect.x * k, y: (box.height - rect.h * k) / 2 - rect.y * k };
  applyView();
}
function applyView() {
  const world = document.getElementById("world");
  if (world) world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
}

/* ---------- persistence, undo, redo ---------- */
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (error) { /* storage unavailable */ } }
function load() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) state = JSON.parse(raw); } catch (error) { state = null; } }
function commit(before) {
  undoStack.push(before); if (undoStack.length > 80) undoStack.shift();
  redoStack = []; save(); render();
}
function act(change) { const before = JSON.stringify(state); change(); commit(before); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(state)); state = JSON.parse(undoStack.pop()); selection.clear(); save(); render(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(state)); state = JSON.parse(redoStack.pop()); selection.clear(); save(); render(); }
function toast(text) {
  toastBox.textContent = text; toastBox.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastBox.hidden = true; }, 3200);
}

/* ---------- table actions ---------- */
function place(id, x, y, extra = {}) {
  const item = Object.assign({ key: state.next++, kind: "card", id, x, y, z: state.top++, exhausted: false, counter: 0, parent: null }, extra);
  state.items.push(item); return item;
}
function placeDie(x, y, extra = {}) {
  const item = Object.assign({ key: state.next++, kind: "die", value: rollDie(), x, y, z: state.top++, parent: null }, extra);
  state.items.push(item); return item;
}
function newGame(aces) {
  undoStack = []; redoStack = []; selection.clear();
  state = {
    wave: 1, round: 1, ranks: [1], next: 1, top: 1, items: [],
    swarmPile: shuffle(idsOf("swarm").filter(id => card(id).rank === 1)), swarmDiscard: [],
    assetPile: shuffle(idsOf("asset").filter(id => !card(id).starting)), assetDiscard: [],
    sectors: aces.map(ace => ({ ace, actionModifier: 0, pending: null })),
  };
  aces.forEach((ace, index) => {
    const area = aceRect(index);
    place(ace, area.x + 20, area.y + 50);
    idsOf("asset").filter(id => card(id).starting).forEach((id, n) => place(id, area.x + 180 + n * 140, area.y + 50));
    place("swarm/infestation", area.x + SECTOR_WIDTH - CARD_WIDTH - 20, 34);
  });
  save(); render();
  fit(window.innerWidth < 700 ? sectorRect(0) : worldRect());
}
function drawFrom(name) {
  const pile = state[name], discardName = name === "swarmPile" ? "swarmDiscard" : "assetDiscard";
  if (!pile.length) {
    if (!state[discardName].length) return null;
    state[name] = shuffle(state[discardName]); state[discardName] = [];
    toast("La défausse est remélangée pour former une nouvelle pile.");
  }
  return state[name].pop();
}
function removeItem(item) {
  state.items.forEach(other => { if (other.parent === item.key) other.parent = null; });
  state.items = state.items.filter(other => other !== item);
  selection.delete(item.key);
}
function discardItem(item) {
  removeItem(item);
  if (item.kind !== "card") return;
  const data = card(item.id);
  if (data.set === "asset") state.assetDiscard.push(item.id);
  else if (data.set === "swarm" && data.kind !== "token" && data.kind !== "infestation") state.swarmDiscard.push(item.id);
}
function returnToPile(item, bottom) {
  const data = card(item.id);
  if (data.set === "ace" || data.kind === "token" || data.kind === "infestation") return toast("Cette carte n'appartient à aucune pile.");
  removeItem(item);
  const pile = state[data.set === "asset" ? "assetPile" : "swarmPile"];
  if (bottom) pile.unshift(item.id); else pile.push(item.id);
}
function itemsIn(rect, filter = () => true) {
  return state.items.filter(item => { const [x, y] = centerOf(item); return inside(rect, x, y) && filter(item); });
}
function invade(sectorIndex) {
  const sector = state.sectors[sectorIndex], zone = zoneRect(sectorIndex, 0), level = threatLevel(state.wave);
  const draws = itemsIn(sectorRect(sectorIndex), item => item.kind === "card" && card(item.id).kind === "infestation").length;
  if (!draws) return toast("Aucune carte Infestation dans ce secteur.");
  let slot = itemsIn(zone, item => item.kind === "card").length, entered = 0;
  const enter = id => { place(id, zone.x + 20 + (slot % 10) * 68, zone.y + 40 + (slot % 3) * 6); slot++; entered++; };
  for (let draw = 0; draw < draws; draw++) {
    let total = 0;
    if (sector.pending) { total += Math.max(0, (card(sector.pending.id).threat || 0) - sector.pending.consumed); enter(sector.pending.id); sector.pending = null; }
    while (total < level) {
      const id = drawFrom("swarmPile");
      if (!id) break;
      const threat = card(id).threat || 0;
      if (total + threat > level) { sector.pending = { id, consumed: level - total }; break; }
      total += threat; enter(id);
    }
  }
  toast(`Invasion chez ${card(sector.ace).name} : ${entered} carte${entered > 1 ? "s" : ""}${sector.pending ? `, ${card(sector.pending.id).name} en attente` : ""}.`);
}
function rollSector(sectorIndex) {
  const sector = state.sectors[sectorIndex], tray = trayRect(sectorIndex);
  itemsIn(tray, item => item.kind === "die" && !item.parent).forEach(removeItem);
  const count = Math.max(1, card(sector.ace).ap + sector.actionModifier);
  for (let n = 0; n < count; n++) placeDie(tray.x + 14 + n * 56, tray.y + 26);
}
function setWave(wave) {
  state.wave = Math.max(1, wave);
  Object.entries(RANK_ADDED_AT_WAVE).forEach(([at, rank]) => {
    if (state.wave >= Number(at) && !state.ranks.includes(rank)) {
      state.ranks.push(rank);
      state.swarmPile = shuffle(state.swarmPile.concat(state.swarmDiscard, idsOf("swarm").filter(id => card(id).rank === rank)));
      state.swarmDiscard = [];
      toast(`Le rang ${ROMAN[rank]} rejoint la pile Essaim, remélangée avec sa défausse.`);
    }
  });
}
function nextWave() {
  state.items.slice().forEach(item => {
    if (item.kind === "die") return removeItem(item);
    const data = card(item.id);
    if (data.set === "swarm" && data.kind !== "infestation") return discardItem(item);
    item.exhausted = false; if (data.set === "asset") item.counter = 0;
  });
  state.sectors.forEach(sector => { if (sector.pending) state.swarmDiscard.push(sector.pending.id); sector.pending = null; sector.actionModifier = 0; });
  state.round = 1; setWave(state.wave + 1);
}
function readyAll(set) { state.items.forEach(item => { if (item.kind === "card" && card(item.id).set === set) item.exhausted = false; }); }

/* ---------- rendering ---------- */
function itemHtml(item) {
  const style = `left:${item.x}px;top:${item.y}px;z-index:${item.z}`;
  if (item.kind === "die") return `<div class="obj die" data-key="${item.key}" style="${style}">${item.value}</div>`;
  const data = card(item.id);
  return `<div class="obj card ${item.exhausted ? "exhausted" : ""} ${selection.has(item.key) ? "selected" : ""}" data-key="${item.key}" data-preview="${item.id}" style="${style}">
    <img src="${data.image}" alt="${escapeHtml(data.name)}" draggable="false">${item.counter ? `<span class="count">${item.counter}</span>` : ""}</div>`;
}
function pileHtml(pile) {
  const count = pile.name === "tokens" ? idsOf("swarm").filter(id => card(id).kind === "token").length : state[pile.name].length;
  const classes = pile.discard ? `discard ${count ? "has" : ""}` : (count ? `full ${pile.kind}` : "");
  return `<div class="obj pile ${classes}" data-pile="${pile.name}" style="left:30px;top:${pile.y}px"><span class="display">${pile.label}</span>${pile.name === "tokens" ? "" : `<b>${count}</b>`}</div>`;
}
function worldHtml() {
  const regions = state.sectors.map((sector, index) => {
    const left = sectorLeft(index), ace = card(sector.ace), tray = trayRect(index);
    const count = Math.max(1, ace.ap + sector.actionModifier);
    const pending = sector.pending ? `<span class="pending" data-preview="${sector.pending.id}">En attente : ${escapeHtml(card(sector.pending.id).name)} (${sector.pending.consumed} payés)</span>` : "";
    return `<div class="head" style="left:${left}px;top:${-HEAD_HEIGHT}px;width:${SECTOR_WIDTH}px;height:${HEAD_HEIGHT}px">
        <span class="display">${escapeHtml(ace.name)}</span><button data-ui data-invade="${index}">Tirage d'invasion</button>${pending}</div>
      ${ZONE_NAMES.map((name, row) => `<div class="region zone ${row % 2 ? "alt" : ""}" style="left:${left}px;top:${row * ZONE_HEIGHT}px;width:${SECTOR_WIDTH}px;height:${ZONE_HEIGHT}px"><span class="label display">${name}</span></div>`).join("")}
      <div class="region ace" style="left:${left}px;top:${3 * ZONE_HEIGHT}px;width:${SECTOR_WIDTH}px;height:${ACE_HEIGHT}px"><span class="label display">${escapeHtml(ace.name)} · Panoplie</span></div>
      <div class="region tray" style="left:${tray.x}px;top:${tray.y}px;width:${tray.w}px;height:${tray.h}px"><span class="label display">Réserve de dés</span></div>
      <div class="rollbar" style="left:${tray.x + tray.w + 14}px;top:${tray.y + 14}px">
        <button data-ui data-action-points="${index}" data-by="-1">−</button><button data-ui class="primary" data-roll="${index}">Lancer ${count} dé${count > 1 ? "s" : ""}</button><button data-ui data-action-points="${index}" data-by="1">+</button></div>`;
  }).join("");
  return regions + PILES.map(pileHtml).join("") + state.items.map(itemHtml).join("");
}
function render() {
  if (!state) { app.innerHTML = setupHtml(); overlay.innerHTML = ""; return; }
  const jumps = state.sectors.map((sector, index) => `<button data-jump="${index}">${escapeHtml(card(sector.ace).name)}</button>`).join("");
  if (!document.getElementById("viewport")) {

  if (item.kind === "die" && /^[1-6]$/.test(key)) return itemAction(item.key, "value", key);
  const action = { t: "exhaust", d: "discard", c: "copy", "+": "plus", "=": "plus", "-": "minus", delete: "remove", backspace: "remove", r: item.kind === "die" ? "reroll" : null }[key];
  if (action) { event.preventDefault(); itemAction(item.key, action); }
});

fetch("cards.json").then(response => response.json()).then(cards => {
  CARDS = cards; load(); render();
  if (state) fit(window.innerWidth < 700 ? sectorRect(0) : worldRect());
}).catch(() => { app.innerHTML = '<p class="hint" style="padding:16px">Impossible de charger les cartes.</p>'; });
</script>
